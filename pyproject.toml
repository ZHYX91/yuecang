[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yuecang"
version = "0.1.0"
description = "阅藏：多来源图书整理工作台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "lxml>=5.3,<7", "markdown-it-py>=3,<5",
  "pypdf>=5,<7", "Pillow>=11,<13", "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
yuecang = "yuecang.cli:main"

[tool.setuptools.package-data]
yuecang = ["web/dist/**/*", "web/dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
